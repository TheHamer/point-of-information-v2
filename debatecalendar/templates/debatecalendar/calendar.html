{% load static %}

<HTML>

    <head>
        <title>Debating Calendar</title>

        <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
    </head>

    <body>

    <header>
        <h1>Debating Calendar</h1>
    </header>

    <div class="searchfields">
        <form method="get">
            {{filter.form}}
            <button type="submit" class="serch-button">submit</button>
        </form>
    </div>

    <div class="tablebody">
        <table class="comptable">
            <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Timezone</th>
                <th>Region</th>
                <th>Circuit</th>
                <th>Online</th>
                <th>Location</th>
                <th>Tab</th>
            </tr>
            {% for item in calendar_items %}
            <tr>
                {% for value in item.values %}
                    <td>{{value}}</td>
                {% endfor %}

            </tr>
            {% endfor %}

        </table>
    </div>

    </body>
</HTML>
